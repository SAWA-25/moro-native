apply plugin: 'com.android.application'

def moroReleaseCertSha256 = (project.findProperty('MORO_RELEASE_CERT_SHA256') ?: System.getenv('MORO_RELEASE_CERT_SHA256') ?: '').toString().trim().toLowerCase()
def moroAndroidSigningPropertiesPath = (project.findProperty('MORO_ANDROID_SIGNING_PROPERTIES') ?: System.getenv('MORO_ANDROID_SIGNING_PROPERTIES') ?: '').toString().trim()
def moroAndroidSigningPropertiesFile = moroAndroidSigningPropertiesPath ? file(moroAndroidSigningPropertiesPath) : null
def moroAndroidSigningProperties = [:]
if (moroAndroidSigningPropertiesFile && moroAndroidSigningPropertiesFile.exists()) {
    moroAndroidSigningPropertiesFile.eachLine('UTF-8') { rawLine ->
        def line = rawLine.trim()
        if (!line || line.startsWith('#')) return
        def splitAt = line.indexOf('=')
        if (splitAt <= 0) return
        moroAndroidSigningProperties[line.substring(0, splitAt).trim()] = line.substring(splitAt + 1).trim()
    }
}

def readSigningProperty = { String name ->
    def direct = (project.findProperty(name) ?: System.getenv(name) ?: '').toString().trim()
    if (direct) return direct

    def legacyNames = [
        'MORO_ANDROID_KEYSTORE_PATH': 'keystore',
        'MORO_ANDROID_KEY_ALIAS': 'alias',
        'MORO_ANDROID_KEYSTORE_PASSWORD': 'storePassword',
        'MORO_ANDROID_KEY_PASSWORD': 'keyPassword',
    ]
    def value = moroAndroidSigningProperties[name] ?: moroAndroidSigningProperties[legacyNames[name] ?: '']
    return value == null ? '' : value.toString().trim()
}

def moroAndroidKeystorePath = readSigningProperty('MORO_ANDROID_KEYSTORE_PATH')
if (moroAndroidKeystorePath) {
    def keystoreFile = new File(moroAndroidKeystorePath)
    if (!keystoreFile.isAbsolute() && moroAndroidSigningPropertiesFile && moroAndroidSigningPropertiesFile.parentFile) {
        moroAndroidKeystorePath = new File(moroAndroidSigningPropertiesFile.parentFile, moroAndroidKeystorePath).path
    }
}
def moroAndroidKeyAlias = readSigningProperty('MORO_ANDROID_KEY_ALIAS')
def moroAndroidKeystorePassword = readSigningProperty('MORO_ANDROID_KEYSTORE_PASSWORD')
def moroAndroidKeyPassword = readSigningProperty('MORO_ANDROID_KEY_PASSWORD')
def hasMoroReleaseSigning = moroAndroidKeystorePath && moroAndroidKeyAlias && moroAndroidKeystorePassword && moroAndroidKeyPassword

android {
    namespace "com.moro.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.moro.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "1.0.8.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "MORO_RELEASE_CERT_SHA256", "\"${moroReleaseCertSha256.replace('"', '')}\""
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasMoroReleaseSigning) {
                storeFile file(moroAndroidKeystorePath)
                storePassword moroAndroidKeystorePassword
                keyAlias moroAndroidKeyAlias
                keyPassword moroAndroidKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            zipAlignEnabled true
            minifyEnabled true
            shrinkResources true
            if (hasMoroReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
