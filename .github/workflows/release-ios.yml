name: Build iOS IPA Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update. Defaults to ios-<run number>.
        required: false
        type: string
      bundle_id:
        description: Fixed iOS bundle identifier for the verified 1.0.6 signing route.
        required: false
        default: wb.uniusc9734.tool7
        type: string
      export_method:
        description: Fixed Xcode export method for the verified 1.0.6 signing route. Use release-ios-unsigned.yml for unsigned builds.
        required: false
        default: release-testing
        type: string
      code_sign_identity:
        description: Fixed code signing identity for the verified 1.0.6 signing route.
        required: false
        default: Apple Distribution
        type: string
  push:
    tags:
      - 'ios-*'
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ios-release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build and upload IPA
    runs-on: macos-latest
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_BUNDLE_ID: ${{ inputs.bundle_id }}
      INPUT_EXPORT_METHOD: ${{ inputs.export_method }}
      INPUT_CODE_SIGN_IDENTITY: ${{ inputs.code_sign_identity }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release settings
        id: release_settings
        shell: bash
        run: |
          set -euo pipefail
          required_bundle_id="wb.uniusc9734.tool7"
          required_export_method="release-testing"
          required_code_sign_identity="Apple Distribution"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag_name="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG}" ]]; then
            tag_name="${INPUT_TAG}"
          else
            tag_name="ios-${GITHUB_RUN_NUMBER}"
          fi

          requested_bundle_id="${INPUT_BUNDLE_ID:-${required_bundle_id}}"
          requested_export_method="${INPUT_EXPORT_METHOD:-${required_export_method}}"
          requested_code_sign_identity="${INPUT_CODE_SIGN_IDENTITY:-${required_code_sign_identity}}"
          if [[ "${requested_bundle_id}" != "${required_bundle_id}" ]]; then
            echo "::error::iOS release IPA must use Bundle ID ${required_bundle_id}; got ${requested_bundle_id}."
            exit 1
          fi
          if [[ "${requested_export_method}" != "${required_export_method}" ]]; then
            echo "::error::iOS release IPA must use export_method ${required_export_method}; got ${requested_export_method}."
            exit 1
          fi
          if [[ "${requested_code_sign_identity}" != "${required_code_sign_identity}" ]]; then
            echo "::error::iOS release IPA must use code_sign_identity ${required_code_sign_identity}; got ${requested_code_sign_identity}."
            exit 1
          fi

          bundle_id="${required_bundle_id}"
          export_method="${required_export_method}"
          code_sign_identity="${required_code_sign_identity}"
          safe_tag="$(printf '%s' "${tag_name}" | tr '/ ' '--')"
          if [[ "${export_method}" == "unsigned" ]]; then
            ipa_name="Moro-${safe_tag}-unsigned.ipa"
          else
            ipa_name="Moro-${safe_tag}.ipa"
          fi

          {
            echo "TAG_NAME=${tag_name}"
            echo "BUNDLE_ID=${bundle_id}"
            echo "EXPORT_METHOD=${export_method}"
            echo "CODE_SIGN_IDENTITY=${code_sign_identity}"
            echo "IPA_NAME=${ipa_name}"
          } >> "${GITHUB_ENV}"
          {
            echo "export_method=${export_method}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check signing secrets
        if: ${{ steps.release_settings.outputs.export_method != 'unsigned' }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISION_PROFILE_BASE64 IOS_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing GitHub repository secrets: ${missing[*]}"
            echo "::error::Add a base64-encoded .p12 certificate, its password, a base64-encoded .mobileprovision profile, and your Apple Developer Team ID."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app and sync Capacitor iOS
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build:ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      - name: Apply iOS app bundle identifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          bundle_id = os.environ["BUNDLE_ID"]
          project = Path("ios/App/App.xcodeproj/project.pbxproj")
          text = project.read_text()
          text, count = re.subn(
              r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;",
              f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};",
              text,
          )
          if count == 0:
              raise SystemExit("No PRODUCT_BUNDLE_IDENTIFIER entries were updated.")
          project.write_text(text)
          print(f"Updated {count} App project bundle identifier entries to {bundle_id}.")
          PY

      - name: Install signing certificate and provisioning profile
        if: ${{ steps.release_settings.outputs.export_method != 'unsigned' }}
        shell: bash
        run: |
          set -euo pipefail

          certificate_path="${RUNNER_TEMP}/ios-signing.p12"
          profile_path="${RUNNER_TEMP}/moro.mobileprovision"
          profile_plist="${RUNNER_TEMP}/moro-profile.plist"
          keychain_path="${RUNNER_TEMP}/moro-signing.keychain-db"
          keychain_password="$(uuidgen)"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "ios-signing.p12").write_bytes(
              base64.b64decode(os.environ["IOS_CERTIFICATE_P12_BASE64"])
          )
          Path(os.environ["RUNNER_TEMP"], "moro.mobileprovision").write_bytes(
              base64.b64decode(os.environ["IOS_PROVISION_PROFILE_BASE64"])
          )
          PY

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" -P "${IOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}"
          if ! security find-identity -v -p codesigning "${keychain_path}" | grep -F "${CODE_SIGN_IDENTITY}" >/dev/null; then
            echo "::error::Imported signing certificate does not expose a ${CODE_SIGN_IDENTITY} identity."
            exit 1
          fi

          security cms -D -i "${profile_path}" > "${profile_plist}"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${profile_plist}")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "${profile_plist}")"

          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${profile_path}" "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

          {
            echo "PROFILE_UUID=${profile_uuid}"
            echo "PROFILE_NAME=${profile_name}"
          } >> "${GITHUB_ENV}"

      - name: Build unsigned iOS app
        if: ${{ steps.release_settings.outputs.export_method == 'unsigned' || steps.release_settings.outputs.export_method == 'release-testing' }}
        shell: bash
        run: |
          set -euo pipefail
          derived_data="${RUNNER_TEMP}/DerivedData"

          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${derived_data}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          app_path="$(find "${derived_data}/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "${app_path}" ]]; then
            echo "::error::No .app bundle was produced by xcodebuild."
            exit 1
          fi

          echo "APP_PATH=${app_path}" >> "${GITHUB_ENV}"

      - name: Archive iOS app
        if: ${{ steps.release_settings.outputs.export_method != 'unsigned' && steps.release_settings.outputs.export_method != 'release-testing' }}
        shell: bash
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/Moro.xcarchive"

          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "${archive_path}" \
            DEVELOPMENT_TEAM="${IOS_TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGN_IDENTITY="${CODE_SIGN_IDENTITY}"

          echo "ARCHIVE_PATH=${archive_path}" >> "${GITHUB_ENV}"

      - name: Export IPA
        if: ${{ steps.release_settings.outputs.export_method != 'unsigned' && steps.release_settings.outputs.export_method != 'release-testing' }}
        shell: bash
        run: |
          set -euo pipefail
          export_path="${RUNNER_TEMP}/ipa"
          export_options="${RUNNER_TEMP}/ExportOptions.plist"

          cat > "${export_options}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>signingCertificate</key>
            <string>${CODE_SIGN_IDENTITY}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${export_path}" \
            -exportOptionsPlist "${export_options}"

          ipa_path="$(find "${export_path}" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "${ipa_path}" ]]; then
            echo "::error::No .ipa was produced by xcodebuild -exportArchive."
            exit 1
          fi

          mkdir -p release
          cp "${ipa_path}" "release/${IPA_NAME}"

      - name: Sign release-testing IPA
        if: ${{ steps.release_settings.outputs.export_method == 'release-testing' }}
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="${RUNNER_TEMP}/ios-signing.p12"
          profile_path="${RUNNER_TEMP}/moro.mobileprovision"
          package_root="${RUNNER_TEMP}/unsigned-ipa"
          payload_dir="${package_root}/Payload"
          unsigned_ipa="${RUNNER_TEMP}/Moro-unsigned.ipa"
          zsign_archive="${RUNNER_TEMP}/zsign-macos-arm64.tar.gz"
          zsign_dir="${RUNNER_TEMP}/zsign"

          if [[ ! -d "${APP_PATH}" ]]; then
            echo "::error::APP_PATH does not point to an app bundle: ${APP_PATH}"
            exit 1
          fi

          actual_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${APP_PATH}/Info.plist")"
          if [[ "${actual_bundle_id}" != "${BUNDLE_ID}" ]]; then
            echo "::error::Built bundle id ${actual_bundle_id} does not match signing profile bundle id ${BUNDLE_ID}."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import plistlib
          import re
          from collections import defaultdict
          from pathlib import Path

          app_path = Path(os.environ["APP_PATH"])
          bundle_id = os.environ["BUNDLE_ID"]

          for info_path in app_path.glob("Frameworks/*.framework/Info.plist"):
              name = info_path.parent.stem
              safe_name = re.sub(r"[^A-Za-z0-9]+", "-", name).strip("-").lower()
              next_id = f"{bundle_id}.framework.{safe_name}"
              with info_path.open("rb") as fh:
                  info = plistlib.load(fh)
              old_id = info.get("CFBundleIdentifier")
              if old_id != next_id:
                  info["CFBundleIdentifier"] = next_id
                  with info_path.open("wb") as fh:
                      plistlib.dump(info, fh)
                  print(f"Framework bundle id: {old_id} -> {next_id}")

          seen = defaultdict(list)
          for info_path in app_path.rglob("Info.plist"):
              try:
                  with info_path.open("rb") as fh:
                      info = plistlib.load(fh)
              except Exception:
                  continue
              bundle = info.get("CFBundleIdentifier")
              if bundle:
                  seen[bundle].append(str(info_path.relative_to(app_path)))

          duplicates = {bundle: paths for bundle, paths in seen.items() if len(paths) > 1}
          if duplicates:
              for bundle, paths in duplicates.items():
                  print(f"Duplicate CFBundleIdentifier {bundle}:")
                  for path in paths:
                      print(f"  - {path}")
              raise SystemExit("Duplicate CFBundleIdentifier values remain in the app bundle.")
          PY

          rm -rf "${package_root}"
          mkdir -p "${payload_dir}" release "${zsign_dir}"
          cp -R "${APP_PATH}" "${payload_dir}/App.app"

          (
            cd "${package_root}"
            zip -qry "${unsigned_ipa}" Payload
          )

          curl -fsSL \
            -o "${zsign_archive}" \
            "https://github.com/zhlynn/zsign/releases/download/v1.0.4/zsign-macos-arm64.tar.gz"
          echo "a4adb52dca395258065d7e738641704eb5e24c174c873b7681c026dfa627974c  ${zsign_archive}" | shasum -a 256 -c -
          tar -xzf "${zsign_archive}" -C "${zsign_dir}"
          chmod +x "${zsign_dir}/zsign"

          "${zsign_dir}/zsign" \
            -k "${certificate_path}" \
            -p "${IOS_CERTIFICATE_PASSWORD}" \
            -m "${profile_path}" \
            -o "release/${IPA_NAME}" \
            "${unsigned_ipa}"

          test -s "release/${IPA_NAME}"

          signed_check_dir="${RUNNER_TEMP}/signed-ipa-check"
          rm -rf "${signed_check_dir}"
          mkdir -p "${signed_check_dir}"
          unzip -q "release/${IPA_NAME}" -d "${signed_check_dir}"
          signed_app_path="$(find "${signed_check_dir}/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "${signed_app_path}" ]]; then
            echo "::error::Signed IPA does not contain a Payload/*.app bundle."
            exit 1
          fi
          SIGNED_APP_PATH="${signed_app_path}" python3 - <<'PY'
          import os
          import plistlib
          from collections import defaultdict
          from pathlib import Path

          app_path = Path(os.environ["SIGNED_APP_PATH"])
          bundle_id = os.environ["BUNDLE_ID"]
          main_info = app_path / "Info.plist"
          with main_info.open("rb") as fh:
              main_bundle_id = plistlib.load(fh).get("CFBundleIdentifier")
          if main_bundle_id != bundle_id:
              raise SystemExit(f"Signed IPA bundle id {main_bundle_id} does not match {bundle_id}.")

          seen = defaultdict(list)
          for info_path in app_path.rglob("Info.plist"):
              try:
                  with info_path.open("rb") as fh:
                      info = plistlib.load(fh)
              except Exception:
                  continue
              bundle = info.get("CFBundleIdentifier")
              if bundle:
                  seen[bundle].append(str(info_path.relative_to(app_path)))

          duplicates = {bundle: paths for bundle, paths in seen.items() if len(paths) > 1}
          if duplicates:
              for bundle, paths in duplicates.items():
                  print(f"Duplicate CFBundleIdentifier {bundle}:")
                  for path in paths:
                      print(f"  - {path}")
              raise SystemExit("duplicateidentifier guard failed: duplicate CFBundleIdentifier values remain in the signed IPA.")

          print(f"Signed IPA bundle identifiers are unique under {bundle_id}.")
          PY

      - name: Package unsigned IPA
        if: ${{ steps.release_settings.outputs.export_method == 'unsigned' }}
        shell: bash
        run: |
          set -euo pipefail
          package_root="${RUNNER_TEMP}/unsigned-ipa"
          payload_dir="${package_root}/Payload"

          rm -rf "${package_root}"
          mkdir -p "${payload_dir}" release
          cp -R "${APP_PATH}" "${payload_dir}/App.app"

          (
            cd "${package_root}"
            zip -qry "${GITHUB_WORKSPACE}/release/${IPA_NAME}" Payload
          )

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: release/${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EXPORT_METHOD}" == "unsigned" ]]; then
            notes="Unsigned iOS IPA built by GitHub Actions run ${GITHUB_RUN_NUMBER}. This file will not install directly on iPhone or iPad until the user re-signs it with their own Apple account, certificate, and provisioning profile."
          else
            notes="Signed iOS IPA built by GitHub Actions run ${GITHUB_RUN_NUMBER}."
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "release/${IPA_NAME}" --clobber
          else
            gh release create "${TAG_NAME}" "release/${IPA_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "Moro ${TAG_NAME}" \
              --notes "${notes}"
          fi
